name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:rules
      - run: cargo test -p todolisto-core
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  windows:
    name: windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build portable exe
        run: npm run tauri -- build --no-bundle
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          Copy-Item target/release/todolisto.exe dist-portable/
          New-Item -ItemType File -Force -Path dist-portable/portable.marker | Out-Null
          Copy-Item packaging/README-portable.txt dist-portable/README.txt
          Compress-Archive -Path dist-portable/* -DestinationPath todolisto-portable-win64.zip -Force
          Get-Item todolisto-portable-win64.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: todolisto-portable-win64
          path: todolisto-portable-win64.zip
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: todolisto-portable-win64.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
