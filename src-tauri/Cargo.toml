[package]
name = "todolisto"
description = "Timestamped session notes for meetings and brainstorming"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "todolisto"

[[bin]]
name = "todolisto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
serde = { workspace = true }
serde_json = { workspace = true }
todolisto-core = { path = "../crates/core" }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json", "query", "form"] }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
url = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
